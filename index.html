<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>크루레이블 제비뽑기</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="제비뽑기">
<meta name="theme-color" content="#070c16">
<style>
  @font-face{
    font-family:'GmarketSans';
    src:url('./font/GmarketSansTTFLight.ttf') format('truetype');
    font-weight:300;
    font-display:swap;
  }
  @font-face{
    font-family:'GmarketSans';
    src:url('./font/GmarketSansTTFMedium.ttf') format('truetype');
    font-weight:500;
    font-display:swap;
  }
  @font-face{
    font-family:'GmarketSans';
    src:url('./font/GmarketSansTTFBold.ttf') format('truetype');
    font-weight:700;
    font-display:swap;
  }
  :root{
    --navy-deep:#000000;
    --navy:#0a0a0a;
    --navy-panel:#1a1a1a;
    --navy-line:#2e2e2e;
    --gold:#f5941f;
    --gold-bright:#ffab4d;
    --ember:#f5941f;
    --text:#f2f2f2;
    --text-dim:#8a8a8a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.85) 55%, #000 100%),
      url('./images/drawing_lots_images.png') center 20% / cover no-repeat,
      var(--navy-deep);
    color:var(--text);
    font-family:'GmarketSans', sans-serif;
    font-weight:500;
    overflow:hidden;
    user-select:none;
  }
  .stage{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .logo-img{
    width:min(70%, 320px);
    height:auto;
    display:block;
    margin:0 auto;
  }

  /* ---------- SETUP SCREEN ---------- */
  .setup{
    width:100%; max-width:480px;
    display:flex; flex-direction:column; align-items:center;
    gap:36px;
  }
  .setup h1{
    font-family:'GmarketSans', sans-serif;
    font-weight:700;
    font-size:clamp(30px,6vw,42px);
    margin:0;
    text-align:center;
    letter-spacing:0.02em;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .setup p.sub{
    margin:-24px 0 0;
    color:var(--text-dim);
    font-size:14px;
    text-align:center;
  }
  .count-panel{
    width:100%;
    background:var(--navy-panel);
    border:1px solid var(--navy-line);
    border-radius:20px;
    padding:28px 24px;
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .count-label{
    font-size:13px;
    color:var(--text-dim);
    letter-spacing:0.08em;
  }
  .count-control{
    display:flex; align-items:center; gap:22px;
  }
  .count-btn{
    width:56px; height:56px;
    border-radius:16px;
    border:1px solid var(--navy-line);
    background:#141414;
    color:var(--gold-bright);
    font-size:26px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .count-btn:active{transform:scale(0.92); background:#242424;}
  .count-value{
    font-family:'GmarketSans', sans-serif;
    font-weight:700;
    font-size:64px;
    min-width:96px;
    text-align:center;
    color:var(--text);
  }
  .count-hint{
    font-size:12px;
    color:var(--text-dim);
  }
  .count-hint b{color:var(--ember); font-weight:700;}
  .start-btn{
    width:100%;
    padding:20px;
    border-radius:16px;
    border:none;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#1a1305;
    font-family:'GmarketSans', sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.04em;
    cursor:pointer;
    box-shadow:0 10px 26px rgba(212,175,106,0.22);
    transition:transform .12s ease;
  }
  .start-btn:active{transform:scale(0.98);}

  /* ---------- DRAW SCREEN ---------- */
  .draw{
    width:100%; max-width:520px;
    display:none;
    flex-direction:column; align-items:center;
    gap:28px;
  }
  .draw.active{display:flex;}
  .setup.hidden{display:none;}

  .progress{
    display:flex; align-items:center; gap:10px;
    font-size:13px;
    color:var(--text-dim);
    letter-spacing:0.06em;
  }
  .progress b{color:var(--gold-bright); font-size:15px;}

  .card-zone{
    width:100%;
    aspect-ratio:1/1;
    max-width:340px;
    perspective:1400px;
  }
  .card{
    width:100%; height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform .62s cubic-bezier(.34,1.4,.4,1);
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg);}
  .card.shake{animation:shake .42s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0) rotate(0);}
    20%{transform:translateX(-8px) rotate(-2deg);}
    40%{transform:translateX(7px) rotate(2deg);}
    60%{transform:translateX(-5px) rotate(-1deg);}
    80%{transform:translateX(4px) rotate(1deg);}
  }
  .face{
    position:absolute; inset:0;
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden;
    border:1px solid rgba(245,148,31,0.35);
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  .face::before, .face::after{
    content:'';
    position:absolute;
    top:50%; width:14px; height:14px;
    background:var(--navy-deep);
    border-radius:50%;
    transform:translateY(-50%);
  }
  .face::before{ left:-1px; }
  .face::after{ right:-1px; }
  .face-front{
    background:linear-gradient(155deg, #1e1e1e, #0f0f0f);
  }
  .face-front .ticket-inner{
    position:absolute; inset:20px;
    border:1px dashed rgba(245,148,31,0.3);
    border-radius:8px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px;
  }
  .face-front .mark{
    width:64px; height:64px;
    border-radius:14px;
    background:linear-gradient(155deg, #262626, #141414);
    border:1px solid rgba(245,148,31,0.5);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .face-front .mark .mark-icon{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .face-front .divider{
    width:36px; height:1px;
    background:rgba(245,148,31,0.4);
  }
  .face-front .ticket-label{
    color:var(--text-dim);
    font-size:13px;
    letter-spacing:0.1em;
  }
  .face-front .tap-txt{
    position:absolute;
    bottom:20px;
    color:var(--text-dim);
    font-size:13px;
    letter-spacing:0.06em;
  }
  .face-back{
    background:linear-gradient(155deg, #262626, #141414);
    transform:rotateY(180deg);
    flex-direction:column;
    gap:6px;
  }
  .face-back .ticket-inner{
    position:absolute; inset:20px;
    border:1px dashed rgba(245,148,31,0.3);
    border-radius:8px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
  }
  .face-back .num-label{
    font-size:18px;
    font-weight:700;
    color:var(--gold-bright);
    letter-spacing:0.04em;
    max-width:80%;
    text-align:center;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .face-back .num{
    font-family:'GmarketSans', sans-serif;
    font-weight:700;
    font-size:100px;
    line-height:1;
    color:var(--text);
  }

  .drawn-list{
    width:100%;
    display:flex; flex-wrap:wrap; gap:8px;
    justify-content:center;
  }
  .chip{
    padding:8px 14px;
    border-radius:999px;
    background:var(--navy-panel);
    border:1px solid var(--navy-line);
    color:var(--text-dim);
    font-size:13px;
  }
  .chip b{color:var(--gold-bright); margin-right:5px;}

  .action-row{
    display:flex; gap:12px; width:100%;
  }
  .ghost-btn{
    flex:1;
    padding:14px;
    border-radius:14px;
    border:1px solid var(--navy-line);
    background:transparent;
    color:var(--text-dim);
    font-size:14px;
    cursor:pointer;
  }
  .ghost-btn:active{background:var(--navy-panel);}

  .name-field{
    width:100%;
    display:flex; flex-direction:column; gap:8px;
  }
  .name-field label{
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:0.08em;
    padding-left:2px;
  }
  .name-field input{
    width:100%;
    padding:16px 18px;
    border-radius:14px;
    border:1px solid var(--navy-line);
    background:#141414;
    color:var(--text);
    font-family:'GmarketSans', sans-serif;
    font-size:18px;
    font-weight:700;
    text-align:center;
    outline:none;
  }
  .name-field input:focus{border-color:var(--gold);}
  .name-field input::placeholder{color:var(--text-dim); font-weight:400;}
  .name-field.locked input{opacity:0.5;}

  .done-banner{
    display:none;
    text-align:center;
    padding:16px;
    border-radius:16px;
    background:rgba(212,175,106,0.10);
    border:1px solid rgba(212,175,106,0.3);
    color:var(--gold-bright);
    font-size:15px;
    font-weight:700;
    width:100%;
  }
  .done-banner.show{display:block;}
</style>
</head>
<body>

<div class="stage">

  <div class="setup" id="setupScreen">
    <img class="logo-img" src="./images/crew%20label%20logo%20white%20text.png.png" alt="Crew Label">
    <h1>제비뽑기</h1>
    <p class="sub">발표 순서를 정해볼게요</p>

    <div class="count-panel">
      <div class="count-label">참여 인원을 설정해주세요</div>
      <div class="count-control">
        <div class="count-btn" id="minusBtn">−</div>
        <div class="count-value" id="countValue">7</div>
        <div class="count-btn" id="plusBtn">+</div>
      </div>
      <div class="count-hint">최소 2명 · 최대 <b>21명</b>까지 설정 가능</div>
    </div>

    <button class="start-btn" id="startBtn">뽑기 시작하기</button>
  </div>

  <div class="draw" id="drawScreen">
    <img class="logo-img" src="./images/crew%20label%20logo%20white%20text.png.png" alt="Crew Label">
    <div class="progress">남은 번호 <b id="remainCount">7</b> / <span id="totalCount">7</span></div>

    <div class="name-field" id="nameField">
      <label>뽑는 사람 이름을 입력해주세요</label>
      <input type="text" id="nameInput" placeholder="예: 홍길동" maxlength="12">
    </div>

    <div class="card-zone">
      <div class="card" id="card">
        <div class="face face-front">
          <div class="ticket-inner">
            <div class="mark"><img src="./icons/icon-192.png" alt="Crew Label" class="mark-icon"></div>
            <div class="divider"></div>
            <div class="ticket-label">TICKET NO.</div>
          </div>
          <div class="tap-txt">이름 입력 후 탭하여 뽑기</div>
        </div>
        <div class="face face-back">
          <div class="ticket-inner">
            <div class="num-label" id="resultName">이름</div>
            <div class="num" id="resultNum">1</div>
          </div>
        </div>
      </div>
    </div>

    <div class="done-banner" id="doneBanner">🎉 모든 번호가 뽑혔습니다!</div>

    <div class="drawn-list" id="drawnList"></div>

    <div class="action-row">
      <button class="ghost-btn" id="backBtn">인원 다시 설정</button>
      <button class="ghost-btn" id="resetBtn">뽑기 초기화</button>
    </div>
  </div>

</div>

<script>
  const MIN_COUNT = 2;
  const MAX_COUNT = 21;
  let count = 7;
  let pool = [];
  let drawnOrder = [];
  let currentFlipped = false;

  const setupScreen = document.getElementById('setupScreen');
  const drawScreen = document.getElementById('drawScreen');
  const countValue = document.getElementById('countValue');
  const minusBtn = document.getElementById('minusBtn');
  const plusBtn = document.getElementById('plusBtn');
  const startBtn = document.getElementById('startBtn');
  const card = document.getElementById('card');
  const resultNum = document.getElementById('resultNum');
  const resultName = document.getElementById('resultName');
  const nameField = document.getElementById('nameField');
  const nameInput = document.getElementById('nameInput');
  const remainCount = document.getElementById('remainCount');
  const totalCount = document.getElementById('totalCount');
  const drawnList = document.getElementById('drawnList');
  const doneBanner = document.getElementById('doneBanner');
  const backBtn = document.getElementById('backBtn');
  const resetBtn = document.getElementById('resetBtn');

  function renderCount(){
    countValue.textContent = count;
  }

  minusBtn.addEventListener('click', () => {
    if(count > MIN_COUNT){ count--; renderCount(); }
  });
  plusBtn.addEventListener('click', () => {
    if(count < MAX_COUNT){ count++; renderCount(); }
  });

  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startDraw(){
    pool = shuffle(Array.from({length: count}, (_, i) => i + 1));
    drawnOrder = [];
    totalCount.textContent = count;
    remainCount.textContent = pool.length;
    drawnList.innerHTML = '';
    doneBanner.classList.remove('show');
    card.classList.remove('flipped');
    currentFlipped = false;
    nameInput.value = '';
    nameField.classList.remove('locked');
    nameInput.disabled = false;
    setupScreen.classList.add('hidden');
    drawScreen.classList.add('active');
    setTimeout(() => nameInput.focus(), 300);
  }

  startBtn.addEventListener('click', startDraw);

  backBtn.addEventListener('click', () => {
    drawScreen.classList.remove('active');
    setupScreen.classList.remove('hidden');
  });

  resetBtn.addEventListener('click', startDraw);

  card.addEventListener('click', () => {
    if(currentFlipped){
      // 다시 뒤집어서 다음 사람 준비
      card.classList.remove('flipped');
      currentFlipped = false;
      nameInput.value = '';
      nameField.classList.remove('locked');
      nameInput.disabled = false;
      setTimeout(() => nameInput.focus(), 350);
      return;
    }
    if(pool.length === 0){
      card.classList.add('shake');
      setTimeout(() => card.classList.remove('shake'), 420);
      return;
    }
    const typedName = nameInput.value.trim();
    if(!typedName){
      nameInput.focus();
      nameField.classList.add('locked');
      setTimeout(() => nameField.classList.remove('locked'), 260);
      return;
    }

    const picked = pool.pop();
    drawnOrder.push({ name: typedName, number: picked });
    resultName.textContent = typedName;
    resultNum.textContent = picked;
    card.classList.add('flipped');
    currentFlipped = true;
    nameInput.disabled = true;
    nameField.classList.add('locked');

    remainCount.textContent = pool.length;

    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `<b>${typedName}</b> → ${picked}번`;
    drawnList.prepend(chip);

    if(pool.length === 0){
      doneBanner.classList.add('show');
    }
  });

  renderCount();

  nameInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !currentFlipped){
      card.click();
    }
  });

  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
    document.addEventListener('click', function fullscreenOnce() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      }
      document.removeEventListener('click', fullscreenOnce);
    });
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

</body>
</html>
